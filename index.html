<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Matemático - Moneda Neón Estelar</title>
    <!-- MathJax para renderizar ecuaciones profesionales -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #04020a;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff66;
            --panel-bg: rgba(14, 14, 28, 0.9);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Fondo de Estrellas Animadas y Desplazamiento (Canvas) */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes neonColorCycle {
            0% { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
            33% { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink), 0 0 30px var(--neon-pink); }
            66% { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green), 0 0 30px var(--neon-green); }
            100% { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
        }

        @keyframes borderColorCycle {
            0% { border-color: var(--neon-cyan); box-shadow: inset 0 0 55px rgba(0, 243, 255, 0.7), 0 0 60px rgba(0, 243, 255, 0.5); }
            33% { border-color: var(--neon-pink); box-shadow: inset 0 0 55px rgba(255, 0, 127, 0.7), 0 0 60px rgba(255, 0, 127, 0.5); }
            66% { border-color: var(--neon-green); box-shadow: inset 0 0 55px rgba(0, 255, 102, 0.7), 0 0 60px rgba(0, 255, 102, 0.5); }
            100% { border-color: var(--neon-cyan); box-shadow: inset 0 0 55px rgba(0, 243, 255, 0.7), 0 0 60px rgba(0, 243, 255, 0.5); }
        }

        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .icon-btn {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--neon-cyan);
            transform: translateY(-2px);
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 6px;
            font-size: clamp(2rem, 5vw, 3.8rem);
            letter-spacing: 2px;
            animation: neonColorCycle 8s infinite;
        }

        .instruction-hint {
            color: #ccc;
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        /* Moneda Gigante Neón */
        .coin-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .giant-coin {
            width: clamp(280px, 45vw, 420px);
            height: clamp(280px, 45vw, 420px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(22, 14, 45, 0.95) 0%, rgba(5, 3, 15, 0.98) 85%);
            border: 8px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            animation: borderColorCycle 8s infinite;
            transition: transform 0.2s ease;
        }

        .giant-coin:hover {
            transform: scale(1.03);
        }

        .coin-inner {
            padding: 20px;
            text-align: center;
            width: 85%;
            height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bingo-text {
            font-size: clamp(2.5rem, 5.5vw, 4.2rem);
            letter-spacing: 2px;
            font-weight: bold;
            animation: neonColorCycle 4s infinite;
        }

        /* Animación de Implosión y Surgimiento (0.9s) */
        @keyframes coinImplodeSlow {
            0% { transform: scale(1); filter: brightness(1); opacity: 1; }
            35% { transform: scale(1.12); filter: brightness(2.5); box-shadow: 0 0 120px #fff, inset 0 0 70px #fff; }
            65% { transform: scale(0.05); filter: brightness(3); opacity: 0.1; }
            100% { transform: scale(1); filter: brightness(1); opacity: 1; }
        }

        .imploding {
            animation: coinImplodeSlow 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Canvas de Chispas */
        #sparkCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            pointer-events: none;
            z-index: 20;
        }

        /* Modal Emergente */
        .popup-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: rgba(18, 18, 36, 0.96);
            border: 5px solid;
            padding: clamp(30px, 8vw, 80px);
            border-radius: 35px;
            text-align: center;
            cursor: pointer;
            max-width: 90%;
            box-sizing: border-box;
            animation: borderColorCycle 6s infinite, popUpScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0.8);
        }

        @keyframes popUpScale {
            to { transform: scale(1); }
        }

        .popup-equation {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: bold;
            animation: neonColorCycle 5s infinite;
        }

        /* Modal Historial */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(6px);
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
            position: relative;
            box-sizing: border-box;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: var(--neon-pink);
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.2);
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            border-bottom: 2px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 12px;
            font-size: 1.4rem;
        }

        ul.history-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            text-align: left;
        }

        ul.history-list li {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.15);
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 12px;
            font-size: 1.2rem;
            color: #ffffff;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Fondo Estelar Neón Más Vivo con Movimiento -->
    <canvas id="bgCanvas"></canvas>

    <div class="top-bar">
        <button class="icon-btn" onclick="openHistory()">Historial</button>
        <button class="icon-btn" onclick="resetGame()" style="border-color: var(--neon-pink); color: var(--neon-pink);">Reiniciar</button>
    </div>

    <div class="container">
        <h1>BINGO MATEMÁTICO</h1>
        <div class="instruction-hint">Haz clic en la moneda para sortear</div>
        
        <div class="coin-wrapper">
            <div id="giantCoin" class="giant-coin" onclick="handleCoinClick()">
                <div class="coin-inner">
                    <div id="coinText" class="bingo-text">¡Bingo!</div>
                </div>
            </div>
            <!-- Canvas para chispas -->
            <canvas id="sparkCanvas" width="600" height="600"></canvas>
        </div>
    </div>

    <!-- Modal Emergente con la Ecuación Gigante -->
    <div id="popupModal" class="popup-modal" onclick="closePopup()">
        <div class="popup-content">
            <div id="popupEquation" class="popup-equation"></div>
        </div>
    </div>

    <!-- Modal Historial -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeHistory()">&times;</button>
            <h2>Historial de Ecuaciones</h2>
            <ul id="historyList" class="history-list">
                <li style="color: #777; justify-content: center; border: none; background: none;">Aún no ha salido ninguna ecuación.</li>
            </ul>
        </div>
    </div>

    <script>
        // --- FONDO ESTELAR NEÓN MÁS VIVO CON MOVIMIENTO ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = [];
        const numStars = 90;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2.2 + 0.6,
                alpha: Math.random(),
                speed: Math.random() * 0.012 + 0.005,
                vy: (Math.random() - 0.5) * 0.4,
                vx: (Math.random() - 0.5) * 0.4,
                color: Math.random() > 0.3 ? '#00f3ff' : (Math.random() > 0.5 ? '#ff007f' : '#00ff66')
            });
        }

        function animateStars() {
            ctx.fillStyle = 'rgba(4, 2, 10, 0.25)';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.15) {
                    star.speed = -star.speed;
                }

                star.x += star.vx;
                star.y += star.vy;

                if (star.x < 0) star.x = width;
                if (star.x > width) star.x = 0;
                if (star.y < 0) star.y = height;
                if (star.y > height) star.y = 0;

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.globalAlpha = Math.abs(star.alpha);
                ctx.shadowBlur = 14;
                ctx.shadowColor = star.color;
                ctx.fill();
            });

            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- SISTEMA DE CHISPAS ---
        const sparkCanvas = document.getElementById('sparkCanvas');
        const sCtx = sparkCanvas.getContext('2d');
        let sparks = [];

        function triggerSparks() {
            sparks = [];
            const colors = ['#00f3ff', '#ff007f', '#00ff66', '#ffffff'];
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 3;
                sparks.push({
                    x: 300,
                    y: 300,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3.5 + 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1.0,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
            requestAnimationFrame(updateSparks);
        }

        function updateSparks() {
            sCtx.clearRect(0, 0, 600, 600);
            if (sparks.length === 0) return;

            sparks.forEach(s => {
                s.x += s.vx;
                s.y += s.vy;
                s.alpha -= s.decay;

                if (s.alpha > 0) {
                    sCtx.save();
                    sCtx.globalAlpha = s.alpha;
                    sCtx.beginPath();
                    sCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    sCtx.fillStyle = s.color;
                    sCtx.shadowBlur = 14;
                    sCtx.shadowColor = s.color;
                    sCtx.fill();
                    sCtx.restore();
                }
            });

            sparks = sparks.filter(s => s.alpha > 0);
            if (sparks.length > 0) {
                requestAnimationFrame(updateSparks);
            }
        }

        // --- LÓGICA DEL JUEGO Y AUDIO (15 Ecuaciones Incluyendo el 0) ---
        const dataEquations = [
            { math: "-4x + 1 = 13" },
            { math: "3x + 4 = -2" },
            { math: "2x + 6 = 4" },
            { math: "2x = 0" },
            { math: "4x - 3 = 1" },
            { math: "2x + 3 = 7" },
            { math: "5x - 7 = 8" },
            { math: "3x - 2 = 10" },
            { math: "3x - 5 = 10" },
            { math: "\\frac{10}{x - 1} = 2" },
            { math: "5(x - 2) = 3x + 4" },
            { math: "\\frac{x}{2} + 3 = 7" },
            { math: "\\sqrt{x} + 2 = 5" },
            { math: "2x - 5 = 15" },
            { math: "\\sqrt{2x + 3} = 5" }
        ];

        let availableEquations = [...dataEquations];
        let drawnEquations = [];
        let isSpinning = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            if (type === 'implode') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.45);
                
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.45);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                [400, 600, 800].forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + index * 0.05);
                    
                    gain.gain.setValueAtTime(0.08, now + index * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.05 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + index * 0.05);
                    osc.stop(now + index * 0.05 + 0.3);
                });
            }
        }

        function handleCoinClick() {
            if (isSpinning) return;

            if (availableEquations.length === 0) {
                resetGame();
                return;
            }

            isSpinning = true;
            const giantCoin = document.getElementById('giantCoin');
            
            playSound('implode');
            giantCoin.classList.add('imploding');

            setTimeout(() => {
                triggerSparks();
                const finalIndex = Math.floor(Math.random() * availableEquations.length);
                const selected = availableEquations.splice(finalIndex, 1)[0];
                
                drawnEquations.push(selected);
                playSound('win');

                updateHistoryList();
                showPopup(selected.math);

                if (availableEquations.length === 0) {
                    setTimeout(() => {
                        document.getElementById('coinText').innerText = "Reiniciar";
                    }, 400);
                }
            }, 450);

            setTimeout(() => {
                giantCoin.classList.remove('imploding');
                isSpinning = false;
            }, 900);
        }

        function showPopup(texMath) {
            const popup = document.getElementById('popupModal');
            const popupEq = document.getElementById('popupEquation');
            popupEq.innerHTML = `\\(${texMath}\\)`;
            popup.style.display = 'flex';
            if (window.MathJax) {
                MathJax.typesetPromise([popupEq]).catch((err) => console.log(err));
            }
        }

        function closePopup() {
            document.getElementById('popupModal').style.display = 'none';
        }

        function updateHistoryList() {
            const list = document.getElementById('historyList');
            if (drawnEquations.length === 0) {
                list.innerHTML = '<li style="color: #777; justify-content: center; border: none; background: none;">Aún no ha salido ninguna ecuación.</li>';
                return;
            }
            list.innerHTML = '';
            drawnEquations.forEach((item) => {
                const li = document.createElement('li');
                const mathSpan = document.createElement('span');
                mathSpan.innerHTML = `\\(${item.math}\\)`;
                li.appendChild(mathSpan);
                list.appendChild(li);
            });
            if (window.MathJax) {
                MathJax.typesetPromise([list]).catch((err) => console.log(err));
            }
        }

        function openHistory() {
            document.getElementById('historyModal').style.display = 'flex';
        }

        function closeHistory() {
            document.getElementById('historyModal').style.display = 'none';
        }

        function resetGame() {
            if (isSpinning) return;
            availableEquations = [...dataEquations];
            drawnEquations = [];
            closePopup();
            updateHistoryList();

            isSpinning = true;
            const giantCoin = document.getElementById('giantCoin');
            
            playSound('implode');
            giantCoin.classList.add('imploding');

            setTimeout(() => {
                triggerSparks();
                document.getElementById('coinText').innerText = "¡Bingo!";
                playSound('win');
            }, 450);

            setTimeout(() => {
                giantCoin.classList.remove('imploding');
                isSpinning = false;
            }, 900);
        }
    </script>
</body>
</html>
